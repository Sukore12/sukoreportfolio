<body>
<header class="site-header">
<a class="brand" href="index.html">J-V Sukore</a>

<nav><ul id="navList"><li><a href="index.html">Home</a></li><li><a href="about.html">About</a></li><li><a href="projects.html">Projects</a></li><li><a href="planner.html">Planner</a></li><li><a href="contact.html" class="active" aria-current="page">Contact</a></li></ul></nav>
</header>
<main>
<section class="panel narrow">
<h1>Contact me</h1>
<form id="contactForm" novalidate>
<label for="name">Name</label>
<input type="text" id="name" name="name">
<span class="err" id="nameErr"></span>
<label for="email">Email address</label>
<input type="email" id="email" name="email">
<span class="err" id="emailErr"></span>
<label for="phone">Phone number</label>
<input type="text" id="phone" name="phone" inputmode="numeric">
<span class="err" id="phoneErr"></span>
<label for="message">Message</label>
<textarea id="message" name="message" rows="5"></textarea>
<span class="err" id="messageErr"></span>
<button class="btn" type="submit">Send message</button>
<p id="formSuccess" class="success" role="status"></p>
</form>
</section>
</main>

</html>
